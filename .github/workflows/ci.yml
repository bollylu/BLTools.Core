name: CI

on:
  create:
    branches:
      - release/**
  push:
    branches:
      - main
      - release/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    env:
      BUILD_CONFIG: Release
      SOLUTION: BLTools.Core.sln

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get Build Version
        id: version
        run: |
          Import-Module ./build/GetBuildVersion.psm1
          $version = GetBuildVersion -VersionString ${{ github.ref }}
          "BUILD_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Build version: $version"
        shell: pwsh

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --configuration ${{ env.BUILD_CONFIG }} -p:Version=${{ env.BUILD_VERSION }} --no-restore

      - name: Pack NuGet packages
        run: dotnet pack ${{ env.SOLUTION }} --configuration ${{ env.BUILD_CONFIG }} -p:Version=${{ env.BUILD_VERSION }} --no-build --output ./nupkg

      - name: Run tests
        run: dotnet test ${{ env.SOLUTION }} --configuration ${{ env.BUILD_CONFIG }} --no-restore --no-build --verbosity normal

        # Get a short-lived NuGet API key
      - name: NuGet login (OIDC → temp API key)
        if: github.event_name != 'pull_request'
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet
        if: github.event_name != 'pull_request' && startsWith(env.BUILD_CONFIG, 'Release')
        run: dotnet nuget push ./nupkg/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --skip-duplicate
